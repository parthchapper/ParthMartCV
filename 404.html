<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aisle not found · Parth Mart</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Press Start 2P'; src: url('/fonts/press-start-2p-latin-400.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Libre Franklin'; src: url('/fonts/libre-franklin-latin-var.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    :root { --floor: #F4EBD9; --floor-2: #ECE0C8; --ink: #2B2118; --ink-2: #5C4A3B; --paper: #FFFDF7; --go: #276B45; --go-dark: #1D5235; --mustard: #E8B23A; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid; place-items: center; min-height: 100vh; padding: 24px 16px;
      font: 400 1.0625rem/1.5 'Libre Franklin', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
      background-color: var(--floor);
      background-image: conic-gradient(var(--floor-2) 25%, transparent 0 50%, var(--floor-2) 0 75%, transparent 0);
      background-size: 72px 72px;
    }
    main { max-width: 30rem; padding: 28px 28px 30px; background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); text-align: center; }
    .sign { display: inline-block; margin: 0 0 20px; padding: 12px 16px 10px; background: var(--mustard); border: 2px solid var(--ink); font: 400 1rem/1.4 'Press Start 2P', ui-monospace, monospace; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: 1.75rem; line-height: 1.15; font-weight: 850; }
    p { margin: 0 0 22px; color: var(--ink-2); }
    a { display: inline-flex; align-items: center; min-height: 3rem; padding: 0 22px; background: var(--go); color: var(--paper); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font-weight: 750; text-decoration: none; }
    a:hover { background: var(--go-dark); }
    a:focus-visible { outline: 3px solid var(--go); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="sign">Aisle 404</p>
    <h1>This aisle doesn't exist</h1>
    <p>The page you were looking for isn't on any shelf. Everything Parth has built is back at the entrance.</p>
    <a href="/">Back to Parth Mart</a>
  </main>
</body>
</html>
